device: cpu

collect:
  n_expert_episodes: 300
  n_noisy_episodes: 100
  noise_eps: 0.3
  aggressive_prob: 0.5
  seed: 0

wm:
  train_steps: 4000
  batch_size: 32
  seq_len: 16

