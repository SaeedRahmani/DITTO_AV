# v0.2 M4 smoke: closed-loop policy on the 297-clip split (V02_PLAN §5)
# stages: data -> clp (BC pretrain + egosim RL + G2 verdict json)
run_dir: runs/b2d_v02_297
device: cuda
seed: 0
env:
  observed_vehicles: 7
  action_space: continuous
  wp_head: true          # policy emits wp plans (champion action space)
  extra_obs_dims: 16     # route conditioning; no lights (champion regime)
  global_arrays: true    # ##glob1 egosim arrays in the npz
clp:
  # smoke-scale steps; architecture at Stage-1 defaults (d192/3L/gru512)
  bc_steps: 12000
  rl_steps: 4000
  rl_batch: 64
  horizon: 40
  bc_kl_coef: 0.1
  divergent_frac: 0.25
