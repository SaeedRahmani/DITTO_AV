# GEN-4 DITTO-WP: on-policy imagination refinement of the waypoint head
# — the DITTO objective restored on the abstraction that drives well.
# WM and BC head are REUSED from gen3_wph (the champion); only the
# imagination stage runs: dream steps through the tracker port
# (deployment-consistent), rewards in the frozen wp-probe subspace
# (task-projected nearest-mode matching, K=8, M=16 negatives), half the
# rollouts from retrieval-relabeled divergent starts (offline DAgger in
# imagination), bc_kl 0.1 anchor (benchmark-proven dose).
run_dir: runs/b2d_gen4_dwp
seed: 0
device: cpu
env:
  action_space: continuous
  wp_head: true
  extra_obs_dims: 16
  light_obs: false
wm:
  train_steps: 60000
  batch_size: 32
  seq_len: 16
ac:
  train_steps: 30000
  horizon: 15
  batch_size: 64
  k_modes: 8
  n_negatives: 16
  bc_kl_coef: 0.1
  wp_imagination: true
  reward_proj: wp
  divergent_frac: 0.5
  divergent_steps: 5
bc:
  train_steps: 0
  lr: 0.0003
