# gen3_wph seed 2 (Phase-5 protocol: full-pipeline seed variance of the champion).
# architecture in our stack. WM/features identical to gen3_clean (its
# world_model.pt is REUSED, not retrained); only BC changes: regresses
# 12-dim wp labels from the same posterior features. Deployment:
# WaypointTracker + executed-control WM feedback (diag_gen3_wph_bc*).
run_dir: runs/b2d_gen3_wph_s2
seed: 2
device: cpu
env:
  action_space: continuous
  wp_head: true
  extra_obs_dims: 16
  light_obs: false
wm:
  train_steps: 60000
  batch_size: 32
  seq_len: 16
ac:
  train_steps: 30000
  horizon: 15
  batch_size: 64
  k_modes: 8
  n_negatives: 16
  bc_kl_coef: 0.1
bc:
  train_steps: 50000
  lr: 0.0003
