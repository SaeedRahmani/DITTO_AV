# v0.2 999-clip scale, TIGHT-PURE variant (the registered thesis reward the
# 297 run never actually tested: single 1 m kernel, no shaping — the
# 297 "pure" run trained with the post-G1 multi-scale default, whose
# 4 m lateral tolerance is implicated in its CARLA lane infractions).
run_dir: runs/b2d_v02_999t
seed: 0
device: cuda
env:
  action_space: continuous
  wp_head: true
  extra_obs_dims: 16
  light_obs: false
  global_arrays: true
clp:
  bc_steps: 20000
  rl_steps: 8000
  bc_kl_coef: 0.1
  divergent_frac: 0.25
  sigma_p2: 0.0
  collision_penalty: 0.0
