# DittoCarlaAgent config: which trained run to drive with.
# best closed-loop driver so far: v3 (K=8,H=15). v4 (K=16,H=5) scored
# net sizes, and run_dir with checkpoints).
run_config: /scratch/srahmani/ditto_av/outputs/b2d_v3_route_config.yaml
policy: ditto_multi
stochastic: false
action_repeat: 2   # leaderboard ticks at 20 Hz; the world model at 10 Hz
# unwedge from obstacles (the universal failure in runs/carla_smoke):
# after >40 model ticks (~4 s) stuck at commanded throttle, back up
# straight and gently for 10 ticks (~1 s), then hand control back; give
# up after 3 fruitless recoveries (2026-07-28 re-baseline: aggressive
# reverse+steer loops caused collision cascades and route deviations)
stuck_recovery: false
stuck_ticks: 40
recover_ticks: 10
# A/B on 3 routes x 3 reps (2026-07-28): raw yaw scored 12.6+-11.3,
# compass (+pi/2) scored 4.5+-2.8, +recovery 1.7 -> raw yaw wins
# empirically; frame geometry needs an offline replay test.
yaw_offset: 0.0
