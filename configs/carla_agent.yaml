# DittoCarlaAgent config: which trained run to drive with.
# best closed-loop driver so far: v3 (K=8,H=15). v4 (K=16,H=5) scored
# net sizes, and run_dir with checkpoints).
# v5 promoted 2026-07-28: doubles v3's closed-loop completion (33.2%
# vs 15.5%, runs/carla_smoke/ROUND2_RESULTS.md) and wins open-loop.
run_config: /home/srahmani/ditto_out/b2d_v5_deploy_config.yaml
policy: ditto_multi
stochastic: false
action_repeat: 2   # leaderboard ticks at 20 Hz; the world model at 10 Hz
# unwedge from obstacles (the universal failure in runs/carla_smoke):
# after >40 model ticks (~4 s) stuck at commanded throttle, back up
# straight and gently for 10 ticks (~1 s), then hand control back; give
# up after 3 fruitless recoveries (2026-07-28 re-baseline: aggressive
# reverse+steer loops caused collision cascades and route deviations)
stuck_recovery: false
stuck_ticks: 40
recover_ticks: 10
# Frame question SETTLED by the offline replay test
# (scripts/replay_frame_check.py, 2026-07-28): with the default
# yaw_offset pi/2 the deployment featurizer reproduces the training obs
# EXACTLY on recorded clips (max diff 1e-4); with 0.0 the obs are
# rotated 90 deg (max diff sqrt(2)). Raw yaw's higher composed score
# (12.6 vs 4.5) is a metric pathology — rotated obs ricochet along the
# route farming completion at penalty 0.12 (9 layout collisions/route)
# while correct obs drive cleanly (penalty 0.65) but wedge behind
# obstacles. Completion must come from the policy (stochastic sampling,
# obstacle-bypass behavior), not from a provably wrong frame.
